name: Continuous Delivery

on:
  push:
    tags:
      - 'v*'
      - 'language_data-v*'

jobs:
  deploy-langcodes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langcodes
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install .[build]
      - name: Build package
        run: python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1

  deploy-language-data:
    if: startsWith(github.ref, 'refs/tags/language_data-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/language-data
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install ./language_data[build]
      - name: Build package
        run: |
          cd language_data
          python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
