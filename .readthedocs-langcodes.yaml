version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

python:
  install:
    # Install the local version of language_data first
    - method: pip
      path: ./language_data
    # Install langcodes
    - method: pip
      path: .
      extra_requirements:
        - data
        - test

sphinx:
  configuration: docs/conf.py
